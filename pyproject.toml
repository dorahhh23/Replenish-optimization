[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replenishment-forecast"
version = "1.0.0"
description = "Auditable dynamic-window demand analysis for a replenishment workbook"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[project.scripts]
replenishment-forecast = "replenishment.__main__:main"

[tool.setuptools.packages.find]
include = ["replenishment*"]
